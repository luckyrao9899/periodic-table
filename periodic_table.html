<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Periodic Table</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 30px;
      font-weight: 700;
      color: #333;
      user-select: none;
    }
    #periodic-table {
      display: grid;
      grid-template-columns: repeat(18, 60px);
      grid-auto-rows: 60px;
      gap: 6px 6px;
      max-width: 1100px;
      justify-content: center;
    }
    #periodic-table button {
      position: relative;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      color: #222;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: visible;
      background-color: #ccc;
    }
    #periodic-table button:hover {
      transform: scale(1.1);
      filter: brightness(0.9);
      z-index: 10;
    }
    #periodic-table button .symbol {
      font-size: 1.6rem;
      line-height: 1;
      pointer-events: none;
    }
    #periodic-table button .atomic-number {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.6rem;
      font-weight: 600;
      color: rgba(0,0,0,0.6);
      pointer-events: none;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #element-info {
      margin-top: 30px;
      font-size: 1.2em;
      text-align: center;
      font-weight: bold;
      color: #444;
      min-height: 1.5em;
      user-select: none;
    }
    /* Empty grid spaces */
    #periodic-table .empty {
      background: transparent;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }
    /* Categories with distinct colors */
    /* Alkali metals - bright yellow */
    #periodic-table button.alkali-metal {
      background-color: #fff59d;
      color: #665500;
      box-shadow: 0 2px 6px #d9d44b;
    }
    #periodic-table button.alkali-metal:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #c6be3c;
    }
    /* Alkaline earth metals - light orange */
    #periodic-table button.alkaline-earth-metal {
      background-color: #ffcc80;
      color: #663d00;
      box-shadow: 0 2px 6px #d4973b;
    }
    #periodic-table button.alkaline-earth-metal:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #b67d23;
    }
    /* Transition metals - soft blue */
    #periodic-table button.transition-metal {
      background-color: #90caf9;
      color: #0d47a1;
      box-shadow: 0 2px 6px #5d8be8;
    }
    #periodic-table button.transition-metal:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #3b5ca8;
    }
    /* Post-transition metals - grayish blue */
    #periodic-table button.post-transition-metal {
      background-color: #b0bec5;
      color: #37474f;
      box-shadow: 0 2px 6px #8a9ba8;
    }
    #periodic-table button.post-transition-metal:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #65737e;
    }
    /* Metalloids - pastel green */
    #periodic-table button.metalloid {
      background-color: #a5d6a7;
      color: #2e7d32;
      box-shadow: 0 2px 6px #7bbf6f;
    }
    #periodic-table button.metalloid:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #4d9b3e;
    }
    /* Nonmetals - soft teal */
    #periodic-table button.nonmetal {
      background-color: #80cbc4;
      color: #004d40;
      box-shadow: 0 2px 6px #4db6ac;
    }
    #periodic-table button.nonmetal:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #00796b;
    }
    /* Halogens - pastel pink */
    #periodic-table button.halogen {
      background-color: #f48fb1;
      color: #880e4f;
      box-shadow: 0 2px 6px #e0668e;
    }
    #periodic-table button.halogen:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #b81b60;
    }
    /* Noble gases - light green */
    #periodic-table button.noble-gas {
      background-color: #a7ffeb;
      color: #004d40;
      box-shadow: 0 2px 6px #4db6ac;
    }
    #periodic-table button.noble-gas:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #00796b;
    }
    /* Lanthanides - lavender */
    #periodic-table button.lanthanide {
      background-color: #ce93d8;
      color: #4a148c;
      box-shadow: 0 2px 6px #b46fc1;
    }
    #periodic-table button.lanthanide:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #6a1b9a;
    }
    /* Actinides - light coral */
    #periodic-table button.actinide {
      background-color: #ef9a9a;
      color: #b71c1c;
      box-shadow: 0 2px 6px #d46f6f;
    }
    #periodic-table button.actinide:hover {
      filter: brightness(0.85);
      box-shadow: 0 4px 8px #8e1a1a;
    }
  </style>
</head>

      {symbol:"Hs",name:"Hassium",atomicNumber:108, category:"transition-metal", gridColumn:8, gridRow:7},
      {symbol:"Mt",name:"Meitnerium",atomicNumber:109, category:"transition-metal", gridColumn:9, gridRow:7},
      {symbol:"Ds",name:"Darmstadtium",atomicNumber:110, category:"transition-metal", gridColumn:10, gridRow:7},
      {symbol:"Rg",name:"Roentgenium",atomicNumber:111, category:"transition-metal", gridColumn:11, gridRow:7},
      {symbol:"Cn",name:"Copernicium",atomicNumber:112, category:"transition-metal", gridColumn:12, gridRow:7},
      {symbol:"Fl",name:"Flerovium",atomicNumber:113, category:"post-transition-metal", gridColumn:13, gridRow:7},

      {symbol:"Ts",name:"Tennessine",atomicNumber:115, category:"halogen", gridColumn:17, gridRow:7},
      {symbol:"Og",name:"Oganesson",atomicNumber:116, category:"noble-gas", gridColumn:18, gridRow:7}

    const categoryClasses = {
      "alkali-metal": "alkali-metal",
      "alkaline-earth-metal": "alkaline-earth-metal",
      "transition-metal": "transition-metal",
      "post-transition-metal": "post-transition-metal",
      "metalloid": "metalloid",
      "nonmetal": "nonmetal",
      "halogen": "halogen",
      "noble-gas": "noble-gas",
      "lanthanide": "lanthanide",
      "actinide": "actinide"
    };

    const tableDiv = document.querySelector("#periodic-table");
    const infoDiv = document.querySelector("#element-info");

    // Create a 10 row by 18 column grid (rows 1 to 7 main + 2 rows for lanthanides and actinides + 1 top row)
    // We'll fill empty spaces with placeholders

    // Prepare a 2D array to hold elements by grid position
    const rows = 10;
    const cols = 18;
    const grid = Array.from({length: rows}, () => Array(cols).fill(null));

    // Place elements in grid
    elements.forEach(el => {
      // gridRow and gridColumn are 1-based, convert to 0-based
      const r = el.gridRow - 1;
      const c = el.gridColumn - 1;
      if(grid[r]) grid[r][c] = el;
    });

    // Fill grid with buttons or empty divs
    for(let r = 0; r < rows; r++) {
      for(let c = 0; c < cols; c++) {
        const el = grid[r][c];
        if(el) {
          const btn = document.createElement("button");
          btn.classList.add(categoryClasses[el.category] || "");
          btn.style.gridColumnStart = c + 1;
          btn.style.gridRowStart = r + 1;

          const atomicNumberSpan = document.createElement("span");
          atomicNumberSpan.className = "atomic-number";
          atomicNumberSpan.textContent = el.atomicNumber;

          const symbolSpan = document.createElement("span");
          symbolSpan.className = "symbol";
          symbolSpan.textContent = el.symbol;

          btn.appendChild(atomicNumberSpan);
          btn.appendChild(symbolSpan);

          btn.onclick = () => {
            alert(`${el.name} (Atomic Number: ${el.atomicNumber})`);
          };

          tableDiv.appendChild(btn);
        } else {
          // empty placeholder
          const emptyDiv = document.createElement("div");
          emptyDiv.classList.add("empty");
          emptyDiv.style.gridColumnStart = c + 1;
          emptyDiv.style.gridRowStart = r + 1;
          tableDiv.appendChild(emptyDiv);
        }
      }
    }
  </script>
</body>
</html>
